name: mapos_app
description: "MAP-OS Mobile — gestão de ordens de serviço."
publish_to: 'none'

version: 4.0.0+40

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado e infraestrutura
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2

  # UI
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  photo_view: ^0.15.0

  # Integrações
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.4
  file_picker: ^13.3.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
